<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>松山・東温 巡回ルートマップ</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #fff; }
    #map-frame { display: block; width: 100%; height: 100%; border: 0; }
    #status {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #333;
      background: #fff;
      z-index: 2;
    }
    #status[hidden] { display: none; }
  </style>
</head>
<body>
  <p id="status" role="status">地図を読み込んでいます…</p>
  <iframe id="map-frame" title="松山・東温 巡回ルートマップ"></iframe>
  <script>
    (() => {
      const frame = document.getElementById('map-frame');
      const status = document.getElementById('status');

      fetch('./legacy-map.html', { cache: 'no-cache' })
        .then(response => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.text();
        })
        .then(source => {
          const doctypeIndex = source.search(/<!doctype\s+html>/i);
          if (doctypeIndex < 0) throw new Error('DOCTYPE not found in legacy map');
          frame.addEventListener('load', () => { status.hidden = true; }, { once: true });
          frame.srcdoc = source.slice(doctypeIndex);
        })
        .catch(error => {
          console.error('Failed to load map:', error);
          status.textContent = '地図を読み込めませんでした。ページを再読み込みしてください。';
        });
    })();
  </script>
</body>
</html>
